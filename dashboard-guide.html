<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘布局使用指南</title>
  <link rel="stylesheet" href="css/dashboard-v2.css">
  <link rel="stylesheet" href="css/dashboard-layout-helper.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0b2c4a 0%, #0e4b6e 100%) fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e6f3fb;
    }
    
    code {
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      color: #90ee90;
    }
    
    pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }
    
    .emoji { font-size: 1.5rem; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <div id="dashboard-shell"></div>

  <script src="js/app-dashboard-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 初始化仪表盘壳层
      DashboardApp.renderShell('#dashboard-shell');
      
      // 设置侧边栏内容
      const sidebarHTML = `
        <nav>
          <ul>
            <li><a href="#overview" onclick="DashboardApp.closeSidebar(); return false;">📊 概述</a></li>
            <li><a href="#usage" onclick="DashboardApp.closeSidebar(); return false;">📖 使用方法</a></li>
            <li><a href="#features" onclick="DashboardApp.closeSidebar(); return false;">✨ 核心特性</a></li>
            <li><a href="#api" onclick="DashboardApp.closeSidebar(); return false;">⚙️ API 文档</a></li>
            <li><a href="#example" onclick="DashboardApp.closeSidebar(); return false;">💡 代码示例</a></li>
          </ul>
        </nav>
      `;
      DashboardApp.setSidebarContent(sidebarHTML);
      
      // 设置主内容
      const mainHTML = `
        <div class="main-content-wrapper">
          <div class="page-header">
            <h1>🚀 仪表盘布局系统</h1>
            <p>统一的两栏布局框架，桌面端侧边栏 + 移动端顶部导航</p>
          </div>

          <section class="card">
            <h2 class="card-title">📊 概述</h2>
            <p>
              本系统提供了一套完整的仪表盘布局解决方案，支持：
            </p>
            <ul>
              <li><strong>桌面端：</strong> 左侧侧边栏（固定宽度 240-250px）+ 右侧主内容区</li>
              <li><strong>平板端：</strong> 与桌面端相同的两栏布局</li>
              <li><strong>移动端：</strong> 顶部横向导航栏 + 全屏主内容，侧边栏可展开</li>
            </ul>
          </section>

          <section class="card">
            <h2 class="card-title">📖 使用方法</h2>
            <h3>第 1 步：在 HTML 中引入样式表</h3>
            <pre><code>&lt;link rel="stylesheet" href="css/dashboard-v2.css"&gt;
&lt;link rel="stylesheet" href="css/dashboard-layout-helper.css"&gt;</code></pre>
            
            <h3>第 2 步：创建容器</h3>
            <pre><code>&lt;div id="dashboard-shell"&gt;&lt;/div&gt;</code></pre>
            
            <h3>第 3 步：初始化 JavaScript</h3>
            <pre><code>&lt;script src="js/app-dashboard-core.js"&gt;&lt;/script&gt;
&lt;script&gt;
  document.addEventListener('DOMContentLoaded', function() {
    // 渲染仪表盘壳层
    DashboardApp.renderShell('#dashboard-shell');
    
    // 设置侧边栏内容
    DashboardApp.setSidebarContent('&lt;nav&gt;...&lt;/nav&gt;');
    
    // 设置主内容
    DashboardApp.setPageContent('&lt;h1&gt;欢迎&lt;/h1&gt;');
  });
&lt;/script&gt;</code></pre>
          </section>

          <section class="card">
            <h2 class="card-title">✨ 核心特性</h2>
            <table>
              <tr>
                <th>特性</th>
                <th>桌面端</th>
                <th>平板端</th>
                <th>移动端</th>
              </tr>
              <tr>
                <td>布局</td>
                <td>✅ 2列</td>
                <td>✅ 2列</td>
                <td>✅ 1列</td>
              </tr>
              <tr>
                <td>侧边栏位置</td>
                <td>✅ 左侧</td>
                <td>✅ 左侧</td>
                <td>✅ 顶部</td>
              </tr>
              <tr>
                <td>导航方向</td>
                <td>✅ 纵向</td>
                <td>✅ 纵向</td>
                <td>✅ 横向</td>
              </tr>
              <tr>
                <td>内容填充</td>
                <td>✅ 右侧占满</td>
                <td>✅ 右侧占满</td>
                <td>✅ 下方占满</td>
              </tr>
              <tr>
                <td>自动隐藏</td>
                <td>✅ 常显示</td>
                <td>✅ 常显示</td>
                <td>✅ 可展开</td>
              </tr>
            </table>
          </section>

          <section class="card">
            <h2 class="card-title">⚙️ API 文档</h2>
            
            <h3>DashboardApp.renderShell(container, options)</h3>
            <p>初始化仪表盘壳层。</p>
            <pre><code>// 使用
DashboardApp.renderShell('#dashboard-shell');

// 返回值: boolean (成功返回 true)</code></pre>

            <h3>DashboardApp.setPageContent(content, options)</h3>
            <p>动态设置主内容区的内容。</p>
            <pre><code>// 使用 HTML 字符串
DashboardApp.setPageContent('&lt;h1&gt;标题&lt;/h1&gt;&lt;p&gt;内容&lt;/p&gt;');

// 使用 HTMLElement
const el = document.createElement('div');
el.innerHTML = '&lt;h1&gt;标题&lt;/h1&gt;';
DashboardApp.setPageContent(el);</code></pre>

            <h3>DashboardApp.setSidebarContent(content)</h3>
            <p>动态设置侧边栏内容。</p>
            <pre><code>DashboardApp.setSidebarContent('&lt;nav&gt;...&lt;/nav&gt;');</code></pre>

            <h3>DashboardApp.toggleSidebar()</h3>
            <p>移动端切换侧边栏展开/收起状态。</p>
            <pre><code>&lt;button onclick="DashboardApp.toggleSidebar()"&gt;菜单&lt;/button&gt;</code></pre>

            <h3>DashboardApp.closeSidebar()</h3>
            <p>移动端关闭侧边栏。</p>
            <pre><code>DashboardApp.closeSidebar();</code></pre>

            <h3>DashboardApp.getViewportSize()</h3>
            <p>获取当前视口大小信息。</p>
            <pre><code>const viewport = DashboardApp.getViewportSize();
console.log(viewport.isMobile); // boolean</code></pre>
          </section>

          <section class="card">
            <h2 class="card-title">💡 完整代码示例</h2>
            
            <h3>示例 1：订单管理页面</h3>
            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;link rel="stylesheet" href="css/dashboard-v2.css"&gt;
  &lt;link rel="stylesheet" href="css/dashboard-layout-helper.css"&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div id="dashboard-shell"&gt;&lt;/div&gt;
  
  &lt;script src="js/app-dashboard-core.js"&gt;&lt;/script&gt;
  &lt;script&gt;
    document.addEventListener('DOMContentLoaded', function() {
      // 初始化
      DashboardApp.renderShell('#dashboard-shell');
      
      // 侧边栏
      fetch('sidebar.html')
        .then(r =&gt; r.text())
        .then(html =&gt; DashboardApp.setSidebarContent(html));
      
      // 主内容
      fetch('pages/orders.html')
        .then(r =&gt; r.text())
        .then(html =&gt; DashboardApp.setPageContent(html));
    });
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>

            <h3>示例 2：顶部菜单按钮</h3>
            <pre><code>&lt;!-- 在侧边栏上方添加菜单按钮（移动端） --&gt;
&lt;div style="display: flex; justify-content: space-between; padding: 1rem;"&gt;
  &lt;h1 style="color: #f5c542; margin: 0;"&gt;JF Gadai&lt;/h1&gt;
  &lt;button class="mobile-nav-toggle" 
          onclick="DashboardApp.toggleSidebar()"
          style="display: none;"&gt;
    ☰ 菜单
  &lt;/button&gt;
&lt;/div&gt;

&lt;style&gt;
  @media (max-width: 768px) {
    .mobile-nav-toggle {
      display: block !important;
    }
  }
&lt;/style&gt;</code></pre>

            <h3>示例 3：动态页面切换</h3>
            <pre><code>// 点击菜单项切换页面
document.querySelectorAll('nav a').forEach(link =&gt; {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const page = this.dataset.page;
    
    fetch(\`pages/\${page}.html\`)
      .then(r =&gt; r.text())
      .then(html =&gt; {
        DashboardApp.setPageContent(html);
        DashboardApp.closeSidebar(); // 移动端自动关闭菜单
      });
  });
});</code></pre>
          </section>

          <section class="card" style="background: rgba(46, 204, 113, 0.2); border-color: rgba(46, 204, 113, 0.4);">
            <h2 class="card-title" style="color: #2ecc71;">✅ 总结</h2>
            <p>
              使用本系统，您可以快速构建响应式仪表盘应用：
            </p>
            <ul>
              <li>✅ 无需重新开发 - 直接使用现成的 CSS 和 JS</li>
              <li>✅ 自动响应式 - 桌面/平板/移动端自适应</li>
              <li>✅ 简洁 API - 只需调用 4-5 个方法</li>
              <li>✅ 易于扩展 - dashboard-layout-helper.css 包含通用样式</li>
              <li>✅ 性能优化 - 滚动条美化、打印样式支持</li>
            </ul>
          </section>
        </div>
      `;
      DashboardApp.setPageContent(mainHTML);
    });
  </script>
</body>
</html>
